<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROUTE — Saved Trips</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eaeae8;color:#1c2420;font:13px Montserrat,Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:16px}.phone{width:min(390px,100%);height:760px;min-height:0;background:#fafafa;border:7px solid #fff;border-radius:39px;box-shadow:0 12px 40px #0002;padding:22px 16px 0;overflow:hidden;display:flex;flex-direction:column}.head{display:flex;align-items:center;justify-content:center;position:relative;height:42px;font-size:17px;font-weight:700}.add{position:absolute;right:6px;top:0;border:0;background:transparent;font-size:27px;cursor:pointer}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 14px}.tabs button{border:0;border-radius:10px;background:#f1f2f2;padding:11px 4px;font:600 11px Montserrat;cursor:pointer}.tabs button.active{background:#baff3b}.trip{display:flex;gap:12px;align-items:center;background:#fff;border-bottom:1px solid #f0f0f0;padding:9px 0;min-height:80px}.thumb{width:75px;height:66px;flex-shrink:0;object-fit:cover;border-radius:10px}.info{min-width:0;flex:1}.info strong{display:block;font-size:12px;margin-bottom:5px}.info small{display:block;color:#939a9a;font-size:10px;line-height:1.7}.trip button{border:0;background:none;cursor:pointer;font-size:21px;color:#788080;padding:4px}.trip button.fav{color:#a2db00}.trip .more{font-size:19px;color:#333}.section{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}.section strong{font-size:16px}.section select{border:0;border-radius:8px;background:white;padding:7px;font:11px Montserrat}.fuel{background:white;border-radius:13px;padding:12px 13px;box-shadow:0 1px 8px #00000007}.total{display:flex;gap:15px;align-items:center;border-bottom:1px solid #ececec;padding-bottom:11px}.total .pump{font-size:27px}.total strong{font-size:20px;display:block}.total small,.stat small{font-size:10px;color:#959a9a;display:block;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:13px 0;text-align:center}.stat+.stat{border-left:1px solid #eee}.stat strong{font-size:12px}.chart{height:120px;display:flex;gap:7px;align-items:end;border-bottom:1px solid #e6e9e4;padding:10px 4px 0;background:repeating-linear-gradient(to top,transparent 0,transparent 27px,#f2f2f2 28px)}.bar{background:#b4fa37;flex:1;min-width:5px;border-radius:2px 2px 0 0}.dates{display:flex;justify-content:space-around;font-size:9px;color:#777;margin-top:7px}.trips-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}.bottom{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);margin:auto -16px 0;border-top:1px solid #eee;padding:12px 0 17px}.bottom a{text-align:center;text-decoration:none;color:#737c83;font-size:10px}.bottom a.active{color:#375b0a;font-weight:700}.bottom a span{display:block;font-size:23px;margin-bottom:5px}.empty{padding:22px;text-align:center;color:#818a81}@media(max-width:450px){main{padding:0}.phone{border:0;border-radius:0;width:100%;height:100dvh;min-height:0}}</style></head><body><main><section class="phone"><div class="head">Saved Trips<button class="add" id="add" aria-label="Add trip">+</button></div><div class="tabs" role="tablist"><button class="active" data-filter="all">All Trips</button><button data-filter="favorite">Favorites</button><button data-filter="recent">Recent</button></div><div class="trips-scroll"><div id="trips"></div><div class="section"><strong>Fuel Costs</strong><select aria-label="Fuel cost period"><option>This Month</option><option>Last Month</option></select></div><div class="fuel"><div class="total"><span class="pump">⛽</span><div><strong>$142.36</strong><small>Total Fuel Cost</small></div></div><div class="stats"><div class="stat"><strong>892 mi</strong><small>Total Distance</small></div><div class="stat"><strong>18.4 mpg</strong><small>Average</small></div><div class="stat"><strong>$3.62</strong><small>Avg. Price/gal</small></div></div><div class="chart" aria-label="Illustrative weekly fuel spending chart" id="chart"></div><div class="dates"><span>May 5</span><span>May 12</span><span>May 19</span><span>May 26</span></div></div></div><nav class="bottom" aria-label="ROUTE navigation"><a href="route-plan.html"><span>⌁</span>Plan</a><a class="active" href="route-trips.html"><span>▣</span>Trips</a><a href="route-plan.html"><span>▤</span>Fuel</a><a href="route-plan.html"><span>♙</span>Profile</a></nav></section></main><script>const data=[{name:'Moab Adventure',where:'Denver, CO → Moab, UT',meta:'385 mi · 6h 48m',img:'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=180&q=75',favorite:true},{name:'Yellowstone Loop',where:'Jackson, WY → Yellowstone, WY',meta:'142 mi · 3h 6m',img:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=180&q=75',favorite:false},{name:'Pacific Northwest',where:'Seattle, WA → Bend, OR',meta:'281 mi · 5h 24m',img:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=180&q=75',favorite:false},{name:'Arizona Weekend',where:'Phoenix, AZ → Sedona, AZ',meta:'117 mi · 2h 28m',img:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=180&q=75',favorite:false}];let filter='all';function render(){const items=data.map((d,i)=>({...d,i})).filter(d=>filter!=='favorite'||d.favorite);document.getElementById('trips').innerHTML=items.length?items.map(d=>'<div class="trip"><img class="thumb" src="'+d.img+'" alt=""><div class="info"><strong>'+d.name+'</strong><small>'+d.where+'</small><small>'+d.meta+'</small></div><button class="'+(d.favorite?'fav':'')+'" aria-label="Toggle favorite" onclick="data['+d.i+'].favorite=!data['+d.i+'].favorite;render()">'+(d.favorite?'★':'☆')+'</button><button class="more" aria-label="Trip options" onclick="location.href=\'route-options.html?planned=1\'">⋮</button></div>').join(''):'<p class="empty">No favorite trips yet.</p>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('add').onclick=()=>location.href='route-plan.html';[20,16,27,52,33,12,42,56,14,35,28,58,41,20].forEach(v=>{let e=document.createElement('div');e.className='bar';e.style.height=v+'%';document.getElementById('chart').append(e)});render();</script></body></html>
