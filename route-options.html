<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROUTE — Route Options</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eeeeec;color:#191d19;font-family:Montserrat,Arial,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:auto;padding:0 24px}.top a{color:#333;text-decoration:none;font-size:13px}.logo{font-weight:800;letter-spacing:.12em}main{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:20px}.phone{width:min(390px,100%);background:#fff;border:7px solid #f9f9f9;border-radius:39px;box-shadow:0 10px 45px #0002;overflow:hidden}.bar{height:67px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:16px;font-weight:700}.bar button{border:0;background:none;font-size:25px;cursor:pointer;color:#333}.map{position:relative;height:350px;overflow:hidden;background:#eaf0e7}.map svg{width:100%;height:100%;display:block}.map-label{position:absolute;font-size:13px;font-weight:700;text-shadow:0 1px white}.denver{right:28px;top:64px}.moab{left:25px;bottom:72px}.map-pill{position:absolute;padding:7px 9px;border-radius:8px;background:#505a53;color:#fff;font-size:12px;font-weight:700}.map-pill.a{top:111px;left:28%}.map-pill.b{top:190px;left:54%;background:#c5fb5c;color:#253300}.map-pill.c{bottom:56px;left:52%}.locate{position:absolute;bottom:15px;right:16px;border:0;border-radius:50%;background:white;width:43px;height:43px;box-shadow:0 2px 10px #0002;font-size:22px;cursor:pointer}.sheet{position:relative;background:#fff;border-radius:23px 23px 0 0;margin-top:-10px;padding:12px 15px 22px;box-shadow:0 -3px 12px #0001}.handle{width:42px;height:4px;border-radius:5px;background:#d9dedb;margin:0 auto 12px}.option{display:flex;align-items:center;gap:15px;border:1px solid #f0f1ef;border-radius:15px;padding:15px 14px;margin-bottom:9px;background:white;width:100%;text-align:left;cursor:pointer;min-height:72px;font-family:inherit}.option.active{border-color:#b4ec4d;background:#f5fce9;box-shadow:0 0 0 1px #d8f5a0 inset}.radio{height:21px;width:21px;border:2px solid #777;border-radius:50%;flex-shrink:0;display:grid;place-items:center}.active .radio{border-color:#1d3213}.active .radio:after{content:'';width:11px;height:11px;border-radius:50%;background:#a7dc26}.detail{flex:1}.detail strong{font-size:16px;display:block;margin-bottom:5px}.detail small{font-size:11px;color:#626b61}.symbol{font-size:24px;color:#4b574b}.chev{font-size:21px;color:#687368}.chart{height:106px;margin:17px 4px 0}.chart svg{width:100%;height:100%}.chart-caption{display:flex;justify-content:space-between;color:#777;font-size:10px;margin:0 5px}.note{font-size:11px;text-align:center;color:#8c948b;margin:13px 0 2px}@media(max-width:450px){main{padding:0}.phone{border:0;border-radius:0;width:100%;min-height:calc(100vh - 64px);box-shadow:none}.map{height:42vh;max-height:380px}}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#liveMap{height:100%;width:100%;z-index:0}.map .leaflet-container{font-family:Montserrat,Arial,sans-serif}.map .leaflet-control-attribution{font-size:9px}.map .leaflet-control-zoom{margin:12px!important}.map .locate{z-index:500}.map-status{position:absolute;z-index:500;top:12px;left:50%;transform:translateX(-50%);background:#fffffff0;padding:8px 11px;border-radius:20px;font-size:10px;font-weight:600;box-shadow:0 2px 8px #0002;white-space:nowrap}.map .map-label,.map .map-pill{display:none}.option:disabled{opacity:.6;cursor:wait}</style></head><body><header class="top"><a href="index.html#route-project">← Back to portfolio</a><span class="logo">ROUTE</span><a href="apps.html#route">Trip calculator ↗</a></header><main><section class="phone" aria-label="Interactive route options preview"><div class="bar"><button onclick="history.back()" aria-label="Go back">‹</button><span>Route Options</span><button aria-label="More options" id="more">⋮</button></div><div class="map"><div id="liveMap" role="application" aria-label="Interactive OpenStreetMap route map from Moab to Denver"></div><div class="map-status" id="mapStatus">Loading live routes…</div><button class="locate" id="fitMap" title="Fit routes on map" aria-label="Fit routes on map">⊙</button></div><div class="sheet"><div class="handle"></div><div id="options"></div><div class="chart"><svg viewBox="0 0 340 108" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a8df44" stop-opacity=".75"/><stop offset="1" stop-color="#a8df44" stop-opacity=".06"/></linearGradient></defs><path d="M34 8V95H334" fill="none" stroke="#c7cec5"/><path d="M34 75L51 69 68 54 85 58 102 48 119 57 136 62 153 55 170 61 187 49 204 43 221 31 238 17 255 28 272 47 289 40 306 42 323 33 334 28V95H34Z" fill="url(#fill)"/><path d="M34 75L51 69 68 54 85 58 102 48 119 57 136 62 153 55 170 61 187 49 204 43 221 31 238 17 255 28 272 47 289 40 306 42 323 33 334 28" fill="none" stroke="#579322" stroke-width="2.5"/><g font-size="9" fill="#777"><text x="1" y="18">8,000′</text><text x="1" y="56">6,000′</text><text x="1" y="94">4,000′</text></g></svg></div><div class="chart-caption"><span>0 mi</span><span>100</span><span>200</span><span>300</span><span id="milesLabel">385 mi</span></div><p class="note">Illustrative routes and elevation · prototype data</p></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const start=[38.5733,-109.5498],end=[39.7392,-104.9903];const map=L.map('liveMap',{zoomControl:true}).setView([39.15,-107.3],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const pin=(p,name)=>L.circleMarker(p,{radius:7,color:'#fff',weight:3,fillColor:'#294e0b',fillOpacity:1}).addTo(map).bindPopup(name);pin(start,'Moab, Utah');pin(end,'Denver, Colorado');
let routes=[],layers=[],active=0;const status=document.getElementById('mapStatus');const optionsEl=document.getElementById('options');
const fmtTime=seconds=>{const m=Math.round(seconds/60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const labels=['Fastest route','Alternative route','Other route'];const icons=['▰','♠','⛰'];
function draw(){layers.forEach(l=>map.removeLayer(l));layers=routes.map((r,i)=>L.geoJSON(r.geometry,{style:{color:i===active?'#a5dc25':'#87918b',weight:i===active?6:4,opacity:i===active?1:.75}}).addTo(map));layers.forEach((l,i)=>l.on('click',()=>choose(i)));if(layers[active])layers[active].bringToFront();}
function render(){optionsEl.innerHTML=routes.map((r,i)=>'<button class="option '+(i===active?'active':'')+'" aria-pressed="'+(i===active)+'" onclick="choose('+i+')"><span class="radio"></span><span class="detail"><strong>'+fmtTime(r.duration)+'</strong><small>'+Math.round(r.distance/1609.344)+' mi · '+labels[i]+'</small></span><span class="symbol">'+icons[i]+'</span><span class="chev">›</span></button>').join('');if(routes[active])document.getElementById('milesLabel').textContent=Math.round(routes[active].distance/1609.344)+' mi';draw()}
function choose(i){active=i;render()}
document.getElementById('fitMap').onclick=()=>{if(layers.length){const group=L.featureGroup(layers);map.fitBounds(group.getBounds(),{padding:[22,22]})}else map.fitBounds([start,end],{padding:[25,25]})};
document.getElementById('more').onclick=()=>alert('Live OpenStreetMap tiles and routing via the public OSRM demo service. Route times are estimates. Elevation chart is illustrative.');
async function load(){try{const url='https://router.project-osrm.org/route/v1/driving/'+start[1]+','+start[0]+';'+end[1]+','+end[0]+'?overview=full&geometries=geojson&alternatives=true&steps=false';const resp=await fetch(url);if(!resp.ok)throw Error('Routing service unavailable');const data=await resp.json();if(data.code!=='Ok'||!data.routes?.length)throw Error('No route found');routes=data.routes.slice(0,3);active=0;render();document.getElementById('fitMap').click();status.textContent='Live map · '+routes.length+' route'+(routes.length===1?'':'s');document.querySelector('.note').textContent='Live map and driving estimates · elevation profile is illustrative';}catch(e){status.textContent='Live map · route service unavailable';optionsEl.innerHTML='<p class="note">The map is live, but driving routes could not load. Please refresh to retry.</p>';document.querySelector('.note').textContent='Elevation profile is illustrative';map.fitBounds([start,end],{padding:[25,25]});}}
load();setTimeout(()=>map.invalidateSize(),300);
</script></body></html>
