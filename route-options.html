2px 8px #00000008}.destination-search .search-icon{font-size:20px;color:#52614d}.destination-search input{min-width:0;flex:1;border:0;outline:0;background:transparent;font:600 14px Montserrat,Arial,sans-serif;color:#1c2718;padding:10px 0}.destination-search button{border:0;border-radius:12px;background:#a7dc25;color:#1b2c10;padding:11px 13px;font:700 12px Montserrat,Arial,sans-serif;cursor:pointer}.destination-search button:disabled{opacity:.55;cursor:wait}.search-results{display:none;position:absolute;z-index:1100;left:0;right:0;bottom:calc(100% + 7px);max-height:240px;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 5px 25px #0002;border:1px solid #e1e6dd}.search-results.open{display:block}.search-results button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #edf0e9;padding:13px 15px;color:#24311e;font:500 12px Montserrat,Arial,sans-serif;line-height:1.5}.search-results button:hover{background:#f2f9e8}.search-feedback{font-size:11px;color:#667260;margin:7px 4px;min-height:14px}</style><style id="route-search-sheet-style">.phone{position:relative}.search-overlay{position:absolute;inset:0;z-index:1500;background:#fff;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;pointer-events:none;border-radius:27px 27px 0 0;overflow:hidden}.search-overlay.open{transform:translateY(0);pointer-events:auto}.search-overlay .sheet-grip{width:39px;height:5px;border-radius:9px;background:#c9ccca;margin:12px auto 19px;flex-shrink:0}.search-overlay .trip-fields{margin:0 16px 13px;border:1px solid #e8ece7;border-radius:19px;background:#f8faf7;position:relative}.search-overlay .trip-row{height:62px;display:flex;align-items:center;gap:13px;padding:0 17px}.search-overlay .trip-row+.trip-row{border-top:1px solid #e1e5df}.trip-dot{height:13px;width:13px;border:4px solid #4080ec;border-radius:50%;flex-shrink:0}.trip-dot.to{border-color:#f06653}.search-overlay .trip-row input{font:500 14px Montserrat,Arial,sans-serif;border:0;outline:0;background:transparent;flex:1;min-width:0;color:#202620}.search-overlay .add-stop{border:1px solid #e3e8e1;background:#fff;border-radius:50%;width:37px;height:37px;font-size:25px;color:#4281e9;cursor:pointer}.search-overlay .vehicle-row{display:flex;align-items:center;gap:12px;margin:0 16px 14px;background:#f8faf7;border-radius:30px;padding:10px 11px 10px 17px;font-size:14px}.vehicle-row span{flex:1}.vehicle-row button{background:#a8df35;border:0;border-radius:25px;padding:9px 15px;font-size:20px;cursor:pointer}.search-overlay .search-sheet-results{flex:1;overflow:auto;border-top:1px solid #edf0eb}.search-overlay .results-heading{padding:18px 20px 9px;color:#818681;font-size:13px;font-weight:700}.search-overlay .place-item{display:flex;align-items:center;gap:13px;padding:16px 20px;width:100%;border:0;border-bottom:1px solid #eef0ec;background:#fff;text-align:left;font-family:inherit;cursor:pointer}.place-item .place-icon{display:grid;place-items:center;width:37px;height:37px;background:#f0f2ef;border-radius:50%;color:#5d675b;font-size:19px;flex-shrink:0}.place-item .place-text{flex:1;min-width:0}.place-text strong{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-text small{display:block;font-size:11px;color:#8b9189;margin-top:5px}.place-item .arrow{font-size:24px}.search-overlay .sheet-actions{padding:10px 16px 16px;display:flex;justify-content:space-between;gap:12px}.sheet-actions button{border:0;border-radius:15px;padding:12px 16px;font:700 12px Montserrat,Arial,sans-serif;cursor:pointer}.sheet-actions .cancel{background:#f0f2ee;color:#364034}.sheet-actions .find{background:#a8df35;color:#22300f}.sheet-message{padding:8px 20px;font-size:11px;color:#6e7769;min-height:27px}.destination-search input{cursor:pointer}@media(max-width:450px){.search-overlay{position:fixed;inset:0;border-radius:25px 25px 0 0;z-index:3000;padding-top:env(safe-area-inset-top)}.search-overlay .trip-row{height:70px}}</style><style>.route-endpoint-label{font:700 12px Montserrat,Arial,sans-serif;background:#fff;border:0;border-radius:7px;padding:5px 8px;box-shadow:0 2px 8px #0002;color:#20330d}.route-endpoint-label:before{border-top-color:#fff!important}</style><style>.route-bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ececec;background:#fafafa;margin-top:12px;padding:12px 0 17px}.route-bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;font-size:11px;color:#697078}.route-bottom-nav a span{font-size:23px}.route-bottom-nav a.active{color:#385b0d;font-weight:700}</style><style>body:not(.has-route-search) .sheet .chart,body:not(.has-route-search) .sheet .chart-caption,body:not(.has-route-search) .sheet .note{display:none}body:not(.has-route-search) .sheet #options{display:none}</style></head><body><header class="top"><a href="index.html#route-project">← Back to portfolio</a><span class="logo">ROUTE</span><a href="apps.html#route">Trip calculator ↗</a></header><main><section class="phone" aria-label="Interactive route options preview"><div class="bar"><button onclick="location.assign('route-plan.html')" aria-label="Go back">‹</button><span>Route Options</span><button aria-label="More options" id="more">⋮</button></div><div class="map"><div id="liveMap" role="application" aria-label="Interactive OpenStreetMap route map from Moab to Denver"></div><div class="map-status" id="mapStatus">Loading live routes…</div><button class="locate" id="fitMap" title="Fit routes on map" aria-label="Fit routes on map">⊙</button></div><div class="sheet"><div class="handle"></div><div id="options"></div><div class="chart" id="elevationChart" role="img" aria-label="Elevation profile along selected route"></div><div class="chart-caption" id="elevationDistances"></div><p class="note" id="elevationNote">Elevation profile loads with the route.</p><div class="destination-search"><div id="searchResults" class="search-results" role="listbox" aria-label="Location suggestions"></div><form id="destinationForm"><span class="search-icon" aria-hidden="true">⌕</span><input id="destinationInput" placeholder="Where to?" aria-label="Where to?" autocomplete="off" required><button id="destinationSubmit" type="submit">Search</button></form><div class="search-feedback" id="searchFeedback" aria-live="polite"></div></div></div><div class="search-overlay" id="searchOverlay" aria-hidden="true"><div class="sheet-grip"></div><div class="trip-fields"><div class="trip-row"><span class="trip-dot"></span><input id="fromField" aria-label="Starting point" value="Moab, Utah" placeholder="Current location"></div><div class="trip-row"><span class="trip-dot to"></span><input id="toField" aria-label="Destination" placeholder="To" autocomplete="off"><button class="add-stop" type="button" id="addStop" title="Add a stop">+</button></div><div id="extraStops"></div></div><div class="vehicle-row"><span>🚘 &nbsp; Driving route</span><button id="sheetGo" aria-label="Search destination">➜</button></div><div class="search-sheet-results"><div class="results-heading" id="sheetResultsHeading">Recent</div><div id="sheetPlaces"></div></div><div class="sheet-message" id="sheetMessage" aria-live="polite"></div><div class="sheet-actions"><button class="cancel" id="closeSearch">Cancel</button><button class="find" id="searchSheetButton">Search locations</button></div></div><nav class="route-bottom-nav" aria-label="ROUTE navigation"><a class="active" href="route-plan.html"><span>⌁</span>Plan</a><a href="route-plan.html"><span>▣</span>Trips</a><a href="route-plan.html"><span>▤</span>Fuel</a><a href="route-plan.html"><span>♙</span>Profile</a></nav></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const start=[38.5733,-109.5498];let end=[39.7392,-104.9903];const map=L.map('liveMap',{zoomControl:true,attributionControl:false}).setView([39.15,-107.3],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png?key=cb1_52dg_1_56864e1cbb62f8d213d7e06e',{subdomains:'abcd',maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:13,maxZoom:19,opacity:0.46,attribution:'Hillshade &copy; Esri',pane:'tilePane'}).addTo(map);
L.control.attribution({prefix:false}).addTo(map);const pin=(p,name)=>L.circleMarker(p,{radius:7,color:'#fff',weight:3,fillColor:'#294e0b',fillOpacity:1}).addTo(map).bindTooltip(name.split(',')[0],{permanent:true,direction:'top',offset:[0,-10],className:'route-endpoint-label'}).bindPopup(name);pin(start,'Moab, Utah');let destinationPin=pin(end,'Denver, Colorado');
let routes=[],layers=[],active=0;const status=document.getElementById('mapStatus');const optionsEl=document.getElementById('options');
const fmtTime=seconds=>{const m=Math.round(seconds/60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const labels=['Fastest route','Alternative route','Other route'];const icons=['▰','♠','⛰'];
function draw(){layers.forEach(l=>map.removeLayer(l));layers=[];routes.forEach((r,i)=>{if(i!==active){const line=L.geoJSON(r.geometry,{style:{color:'#929c91',weight:4,opacity:.65}}).addTo(map);line.on('click',()=>choose(i));layers.push(line)}});if(routes[active]){const selected=routes[active];const shadow=L.geoJSON(selected.geometry,{style:{color:'#202b13',weight:12,opacity:.22,lineCap:'round',lineJoin:'round'}}).addTo(map);const casing=L.geoJSON(selected.geometry,{style:{color:'#baff21',weight:10,opacity:1,lineCap:'round',lineJoin:'round'}}).addTo(map);const highlight=L.geoJSON(selected.geometry,{style:{color:'#283c0a',weight:5,opacity:1,lineCap:'round',lineJoin:'round'}}).addTo(map);layers.push(shadow,casing,highlight)}destinationPin.bringToFront();}
function render(){optionsEl.innerHTML=routes.map((r,i)=>'<button class="option '+(i===active?'active':'')+'" aria-pressed="'+(i===active)+'" onclick="choose('+i+')"><span class="radio"></span><span class="detail"><strong>'+fmtTime(r.duration)+'</strong><small>'+Math.round(r.distance/1609.344)+' mi · '+labels[i]+'</small></span><span class="symbol">'+icons[i]+'</span><span class="chev">›</span></button>').join('');draw();updateElevation()}
let elevationRequest=0;
const elevationChart=document.getElementById('elevationChart');
const elevationDistances=document.getElementById('elevationDistances');
const elevationNote=document.getElementById('elevationNote');
function sampleRoute(route,count=75){
  const coords=route.geometry.coordinates;
  if(!coords||coords.length<2)throw Error('No route geometry');
  const distances=[0];
  for(let i=1;i<coords.length;i++){
    const a=coords[i-1],b=coords[i],lat1=a[1]*Math.PI/180,lat2=b[1]*Math.PI/180;
    const dlat=lat2-lat1,dlon=(b[0]-a[0])*Math.PI/180;
    const h=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;
    distances.push(distances[i-1]+12742000*Math.asin(Math.min(1,Math.sqrt(h))));
  }
  const total=distances[distances.length-1],points=[];let index=1;
  for(let i=0;i<count;i++){
    const target=total*i/(count-1);
    while(index<distances.length-1&&distances[index]<target)index++;
    const before=distances[index-1],after=distances[index],fraction=after>before?(target-before)/(after-before):0;
    const a=coords[index-1],b=coords[index];
    points.push([a[1]+(b[1]-a[1])*fraction,a[0]+(b[0]-a[0])*fraction]);
  }
  return points;
}
function renderElevation(values,route){
  const feet=values.map(v=>v*3.28084);
  const low=Math.floor((Math.min(...feet)-350)/1000)*1000;
  const high=Math.ceil((Math.max(...feet)+350)/1000)*1000;
  const range=Math.max(1,high-low),x=i=>34+i*300/(feet.length-1),y=v=>95-(v-low)*82/range;
  const path=feet.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=path+' L334 95 L34 95 Z';
  const ticks=[0,1,2].map(i=>{const v=low+(high-low)*i/2;return '<text x="1" y="'+(y(v)+3).toFixed(1)+'">'+Math.round(v).toLocaleString()+'′</text>'}).join('');
  elevationChart.innerHTML='<svg viewBox="0 0 340 108" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="actualElevationFill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a8df44" stop-opacity=".75"/><stop offset="1" stop-color="#a8df44" stop-opacity=".06"/></linearGradient></defs><path d="M34 8V95H334" fill="none" stroke="#c7cec5"/><path d="'+area+'" fill="url(#actualElevationFill)"/><path d="'+path+'" fill="none" stroke="#579322" stroke-width="2.5"/><g font-size="9" fill="#777">'+ticks+'</g></svg>';
  const miles=Math.round(route.distance/1609.344);
  elevationDistances.innerHTML=[0,.25,.5,.75,1].map(f=>'<span>'+Math.round(miles*f)+(f===0||f===1?' mi':'')+'</span>').join('');
  elevationNote.textContent='Terrain elevation along selected route · Open-Meteo / Copernicus DEM (90 m resolution)';
}
async function updateElevation(){
  const id=++elevationRequest,route=routes[active];
  elevationChart.innerHTML='';elevationDistances.innerHTML='';
  if(!route){elevationNote.textContent='Search for a route to view elevation';return}
  elevationNote.textContent='Loading actual terrain elevation…';
  try{
    const points=sampleRoute(route);
    const latitude=points.map(p=>p[0].toFixed(5)).join(',');
    const longitude=points.map(p=>p[1].toFixed(5)).join(',');
    const response=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+latitude+'&longitude='+longitude);
    if(!response.ok)throw Error('Elevation service unavailable');
    const data=await response.json();
    if(!Array.isArray(data.elevation)||data.elevation.length!==points.length||data.elevation.some(v=>!Number.isFinite(v)))throw Error('Invalid elevation response');
    if(id!==elevationRequest)return;
    renderElevation(data.elevation,route);
  }catch(e){if(id!==elevationRequest)return;elevationNote.textContent='Elevation data unavailable for this route. Try again later.'}
}
function choose(i){active=i;render()}
document.getElementById('fitMap').onclick=()=>{if(layers.length){const group=L.featureGroup(layers);map.fitBounds(group.getBounds(),{padding:[22,22]})}else map.fitBounds([start,end],{padding:[25,25]})};
document.getElementById('more').onclick=()=>alert('Live OpenStreetMap tiles and routing via the public OSRM demo service. Route times are estimates. Elevation chart is illustrative.');
async function load(){document.body.classList.add('has-route-search');status.textContent="Loading driving routes…";try{const url='https://router.project-osrm.org/route/v1/driving/'+start[1]+','+start[0]+';'+end[1]+','+end[0]+'?overview=full&geometries=geojson&alternatives=3&steps=false';const resp=await fetch(url);if(!resp.ok)throw Error('Routing service unavailable');const data=await resp.json();if(data.code!=='Ok'||!data.routes?.length)throw Error('No route found');routes=data.routes.slice(0,3);active=0;render();document.getElementById('fitMap').click();status.textContent=routes.length===3?'Live map · Recommended + 2 alternatives':'Live map · '+routes.length+' available route'+(routes.length===1?'':'s');}catch(e){status.textContent='Live map · route service unavailable';optionsEl.innerHTML='<p class="note">The map is live, but driving routes could not load. Please refresh to retry.</p>';map.fitBounds([start,end],{padding:[25,25]});}}
const input=document.getElementById('destinationInput'),results=document.getElementById('searchResults'),feedback=document.getElementById('searchFeedback'),submit=document.getElementById('destinationSubmit');let matches=[];
async function geocode(query){const response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(query),{headers:{'Accept':'application/json'}});if(!response.ok)throw Error('Location search unavailable');return await response.json();}
function selectPlace(place){end=[Number(place.lat),Number(place.lon)];map.removeLayer(destinationPin);destinationPin=pin(end,place.display_name);input.value=place.display_name.split(',').slice(0,2).join(',');results.classList.remove('open');feedback.textContent='Showing routes to '+input.value;status.textContent='Highlighting route to '+input.value+'…';load();}
document.getElementById('destinationForm').addEventListener('submit',async event=>{event.preventDefault();const q=input.value.trim();if(!q)return;submit.disabled=true;feedback.textContent='Searching locations…';results.classList.remove('open');try{matches=await geocode(q);if(!matches.length){feedback.textContent='No matching locations found. Try a city or address.';return;}results.innerHTML='';matches.forEach((place,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.textContent=place.display_name;b.onclick=()=>selectPlace(matches[i]);results.appendChild(b)});results.classList.add('open');feedback.textContent='Choose a location to see driving routes.';}catch(e){feedback.textContent='Search unavailable. Please try again.';}finally{submit.disabled=false;}});
document.addEventListener('click',e=>{if(!e.target.closest('.destination-search'))results.classList.remove('open')});
if(new URLSearchParams(location.search).get('planned')==='1'){load()}else{status.textContent='Search for a route to begin';document.getElementById('options').innerHTML='';}setTimeout(()=>map.invalidateSize(),300);
</script><script>
const overlay=document.getElementById('searchOverlay'),toField=document.getElementById('toField'),fromField=document.getElementById('fromField'),places=document.getElementById('sheetPlaces'),sheetMessage=document.getElementById('sheetMessage'),heading=document.getElementById('sheetResultsHeading');let searchTimer=0;let recentPlaces=[];try{recentPlaces=JSON.parse(localStorage.getItem('routeRecentPlaces')||'[]')}catch(e){}
function openSearch(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');toField.value=input.value||'';showRecent();setTimeout(()=>toField.focus(),280)}
function closeSearch(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');toField.blur()}
function item(place,icon){const b=document.createElement('button');b.type='button';b.className='place-item';const ic=document.createElement('span');ic.className='place-icon';ic.textContent=icon;const tx=document.createElement('span');tx.className='place-text';const title=document.createElement('strong');title.textContent=place.display_name.split(',')[0];const sub=document.createElement('small');sub.textContent=place.display_name.split(',').slice(1,3).join(',').trim()||'Destination';tx.append(title,sub);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';b.append(ic,tx,arrow);b.onclick=()=>{recentPlaces=[place,...recentPlaces.filter(p=>p.display_name!==place.display_name)].slice(0,5);try{localStorage.setItem('routeRecentPlaces',JSON.stringify(recentPlaces))}catch(e){}selectPlace(place);closeSearch()};places.appendChild(b)}
function showRecent(){heading.textContent='Recent';places.replaceChildren();if(recentPlaces.length)recentPlaces.forEach(p=>item(p,'◷'));else{const p=document.createElement('p');p.style.cssText='padding:10px 20px;color:#888;font-size:12px';p.textContent='Search for a destination to see recent places here.';places.appendChild(p)}sheetMessage.textContent=''}
async function searchSheet(){const q=toField.value.trim();if(!q){showRecent();return}heading.textContent='Search results';sheetMessage.textContent='Searching locations…';try{const found=await geocode(q);places.replaceChildren();if(found.length){found.forEach(p=>item(p,'⌖'));sheetMessage.textContent='Select a destination to update the map.'}else sheetMessage.textContent='No locations found. Try a city or street address.'}catch(e){sheetMessage.textContent='Location search unavailable. Please try again.'}}
toField.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchSheet,450)});toField.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchSheet()}if(e.key==='Escape')closeSearch()});document.getElementById('searchSheetButton').onclick=searchSheet;document.getElementById('sheetGo').onclick=searchSheet;document.getElementById('closeSearch').onclick=closeSearch;document.getElementById('addStop').onclick=()=>{sheetMessage.textContent='Additional stops are not yet supported by this route preview.'};
input.addEventListener('focus',openSearch);input.addEventListener('click',openSearch);
</script></body></html>
