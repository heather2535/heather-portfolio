<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROUTE — Route Options</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eeeeec;color:#191d19;font-family:Montserrat,Arial,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:auto;padding:0 24px}.top a{color:#333;text-decoration:none;font-size:13px}.logo{font-weight:800;letter-spacing:.12em}main{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:20px}.phone{width:min(390px,100%);background:#fff;border:7px solid #f9f9f9;border-radius:39px;box-shadow:0 10px 45px #0002;overflow:hidden}.bar{height:67px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:16px;font-weight:700}.bar button{border:0;background:none;font-size:25px;cursor:pointer;color:#333}.map{position:relative;height:350px;overflow:hidden;background:#eaf0e7}.map svg{width:100%;height:100%;display:block}.map-label{position:absolute;font-size:13px;font-weight:700;text-shadow:0 1px white}.denver{right:28px;top:64px}.moab{left:25px;bottom:72px}.map-pill{position:absolute;padding:7px 9px;border-radius:8px;background:#505a53;color:#fff;font-size:12px;font-weight:700}.map-pill.a{top:111px;left:28%}.map-pill.b{top:190px;left:54%;background:#c5fb5c;color:#253300}.map-pill.c{bottom:56px;left:52%}.locate{position:absolute;bottom:15px;right:16px;border:0;border-radius:50%;background:white;width:43px;height:43px;box-shadow:0 2px 10px #0002;font-size:22px;cursor:pointer}.sheet{position:relative;background:#fff;border-radius:23px 23px 0 0;margin-top:-10px;padding:12px 15px 22px;box-shadow:0 -3px 12px #0001}.handle{width:42px;height:4px;border-radius:5px;background:#d9dedb;margin:0 auto 12px}.option{display:flex;align-items:center;gap:15px;border:1px solid #f0f1ef;border-radius:15px;padding:15px 14px;margin-bottom:9px;background:white;width:100%;text-align:left;cursor:pointer;min-height:72px;font-family:inherit}.option.active{border-color:#b4ec4d;background:#f5fce9;box-shadow:0 0 0 1px #d8f5a0 inset}.radio{height:21px;width:21px;border:2px solid #777;border-radius:50%;flex-shrink:0;display:grid;place-items:center}.active .radio{border-color:#1d3213}.active .radio:after{content:'';width:11px;height:11px;border-radius:50%;background:#a7dc26}.detail{flex:1}.detail strong{font-size:16px;display:block;margin-bottom:5px}.detail small{font-size:11px;color:#626b61}.symbol{font-size:24px;color:#4b574b}.chev{font-size:21px;color:#687368}.chart{height:106px;margin:17px 4px 0}.chart svg{width:100%;height:100%}.chart-caption{display:flex;justify-content:space-between;color:#777;font-size:10px;margin:0 5px}.note{font-size:11px;text-align:center;color:#8c948b;margin:13px 0 2px}@media(max-width:450px){main{padding:0}.phone{border:0;border-radius:0;width:100%;min-height:calc(100vh - 64px);box-shadow:none}.map{height:42vh;max-height:380px}}</style></head><body><header class="top"><a href="index.html#route-project">← Back to portfolio</a><span class="logo">ROUTE</span><a href="apps.html#route">Trip calculator ↗</a></header><main><section class="phone" aria-label="Interactive route options preview"><div class="bar"><button onclick="history.back()" aria-label="Go back">‹</button><span>Route Options</span><button aria-label="More options" id="more">⋮</button></div><div class="map"><svg viewBox="0 0 370 350" preserveAspectRatio="xMidYMid slice" aria-label="Illustrative map of three routes between Moab and Denver"><defs><pattern id="terrain" width="95" height="83" patternUnits="userSpaceOnUse"><rect width="95" height="83" fill="#eaf0e7"/><path d="M-10 29Q15 0 36 15T90 4L108 35Q67 44 42 33T-10 29Z" fill="#d9e8d5"/><path d="M8 80Q26 53 49 66T100 48" stroke="#cbdac9" stroke-width="15" fill="none" opacity=".65"/><path d="M0 44L95 54M52 0L59 83" stroke="#f9f9ed" stroke-width="3" fill="none"/></pattern></defs><rect width="370" height="350" fill="url(#terrain)"/><path d="M42 254 C70 205 94 184 127 158 S190 145 209 121 S265 86 320 99" fill="none" stroke="#929795" stroke-width="4.5" stroke-linecap="round"/><path d="M42 254 C93 271 130 303 173 296 S260 311 292 274 S328 181 320 99" fill="none" stroke="#929795" stroke-width="4.5" stroke-linecap="round"/><path id="routeLine" d="M42 254 C77 238 90 256 116 230 S162 239 188 209 S232 214 252 176 S289 169 320 99" fill="none" stroke="#26370b" stroke-width="7" stroke-linecap="round"/><path id="routeHighlight" d="M42 254 C77 238 90 256 116 230 S162 239 188 209 S232 214 252 176 S289 169 320 99" fill="none" stroke="#a8e324" stroke-width="4" stroke-linecap="round"/><g fill="#24450d" stroke="white" stroke-width="3"><path d="M42 239a11 11 0 0 0-11 11c0 9 11 20 11 20s11-11 11-20a11 11 0 0 0-11-11Z"/><circle cx="42" cy="250" r="3" fill="white" stroke="none"/><circle cx="320" cy="99" r="10"/><circle cx="320" cy="99" r="3" fill="white" stroke="none"/></g></svg><span class="map-label denver">Denver</span><span class="map-label moab">Moab</span><span class="map-pill a">7h 25m</span><span class="map-pill b" id="selectedMapTime">6h 48m</span><span class="map-pill c">8h 12m</span><button class="locate" title="Center map" onclick="document.querySelector('.map').scrollIntoView({behavior:'smooth'})">⊙</button></div><div class="sheet"><div class="handle"></div><div id="options"></div><div class="chart"><svg viewBox="0 0 340 108" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a8df44" stop-opacity=".75"/><stop offset="1" stop-color="#a8df44" stop-opacity=".06"/></linearGradient></defs><path d="M34 8V95H334" fill="none" stroke="#c7cec5"/><path d="M34 75L51 69 68 54 85 58 102 48 119 57 136 62 153 55 170 61 187 49 204 43 221 31 238 17 255 28 272 47 289 40 306 42 323 33 334 28V95H34Z" fill="url(#fill)"/><path d="M34 75L51 69 68 54 85 58 102 48 119 57 136 62 153 55 170 61 187 49 204 43 221 31 238 17 255 28 272 47 289 40 306 42 323 33 334 28" fill="none" stroke="#579322" stroke-width="2.5"/><g font-size="9" fill="#777"><text x="1" y="18">8,000′</text><text x="1" y="56">6,000′</text><text x="1" y="94">4,000′</text></g></svg></div><div class="chart-caption"><span>0 mi</span><span>100</span><span>200</span><span>300</span><span id="milesLabel">385 mi</span></div><p class="note">Illustrative routes and elevation · prototype data</p></div></section></main><script>const options=[{time:'6h 48m',miles:385,label:'Scenic route',icon:'⛰',path:'M42 254 C77 238 90 256 116 230 S162 239 188 209 S232 214 252 176 S289 169 320 99'},{time:'7h 25m',miles:402,label:'Balanced',icon:'♠',path:'M42 254 C70 205 94 184 127 158 S190 145 209 121 S265 86 320 99'},{time:'8h 12m',miles:436,label:'Alternative route',icon:'▰',path:'M42 254 C93 271 130 303 173 296 S260 311 292 274 S328 181 320 99'}];let active=0;function render(){document.getElementById('options').innerHTML=options.map((o,i)=>'<button class="option '+(i===active?'active':'')+'" aria-pressed="'+(i===active)+'" onclick="choose('+i+')"><span class="radio"></span><span class="detail"><strong>'+o.time+'</strong><small>'+o.miles+' mi · '+o.label+'</small></span><span class="symbol">'+o.icon+'</span><span class="chev">›</span></button>').join('');let o=options[active];document.getElementById('routeLine').setAttribute('d',o.path);document.getElementById('routeHighlight').setAttribute('d',o.path);document.getElementById('selectedMapTime').textContent=o.time;document.getElementById('milesLabel').textContent=o.miles+' mi'}function choose(i){active=i;render()}document.getElementById('more').onclick=()=>alert('ROUTE interface prototype · routes shown are illustrative, not live directions.');render();</script></body></html>
