<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product tools — Heather Davies</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182333;font:14px Inter,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #e0e6ed}nav{max-width:1280px;margin:auto;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:20px;font-weight:800;letter-spacing:-.04em;color:#101927}.back{color:#566a81;text-decoration:none;font-size:13px}main{max-width:1280px;padding:40px 28px 80px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--accent)}h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.045em;margin:10px 0}h2{font-size:19px;letter-spacing:-.02em;margin:0}.lead{color:#65768b;line-height:1.6;max-width:730px;margin:0}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px;margin-top:30px}.panel{background:#fff;border:1px solid #e0e6ed;border-radius:14px;padding:22px}.form-title{margin-bottom:18px}.field{display:block;color:#40546a;font-size:12px;font-weight:600;margin:0 0 13px}.field input,.field select,.field textarea{width:100%;display:block;border:1px solid #d9e2eb;border-radius:7px;padding:10px;margin-top:6px;font:14px Inter,Arial;background:#fff;color:#182333}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{padding:18px;border:1px solid #e0e6ed;border-radius:10px}.stat small{display:block;color:#6b7b8d;font-size:12px}.stat strong{display:block;font-size:25px;margin-top:9px;letter-spacing:-.04em}.entries{margin-top:20px}.entry{border-top:1px solid #edf0f3;padding:16px 0;display:flex;justify-content:space-between;gap:15px}.entry h3{font-size:15px;margin:0 0 6px}.entry p{font-size:13px;line-height:1.55;color:#65768b;margin:3px 0}.remove{background:none;border:0;color:#6b7c8e;font:12px Inter;cursor:pointer}.entry img{max-width:160px;max-height:120px;object-fit:cover;border-radius:7px;margin-top:8px}.hint,.notice{font-size:12px;color:#66788e;line-height:1.6}.notice{padding:13px 16px;border-radius:8px;background:#edf4fc;margin-top:24px}.empty{color:#738399;padding:30px 0}.filters{display:flex;gap:10px;align-items:center;margin-top:15px}.filters input{border:1px solid #d9e2eb;border-radius:7px;padding:9px;max-width:260px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.tools a{color:#40546a;text-decoration:none;border:1px solid #d9e2eb;background:white;padding:8px 12px;border-radius:20px;font-size:12px}.tools a.active{background:#e5effb;color:#1a5bac;border-color:#bed4ef}@media(max-width:800px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}main{padding:30px 17px 60px}nav{padding:17px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.panel{padding:18px}}</style></head><body><header><nav><a class="back" href="index.html#product-ideas">← Heather Davies / Work</a><div class="brand" id="brand"></div></nav></header><main><div id="content"></div><nav class="tools" aria-label="More tools" id="navtools"></nav><p class="notice">Entries are saved in this browser on this device. These first versions use information you enter; they do not connect to outside services. Clearing browser data can remove your entries.</p></main><script>
const configs={shift:{accent:'#2377e8',title:'Make sense of every shift.',desc:'Log work, mileage and expenses to understand what your time earns.',fields:[['date','Date','date',true],['platform','Platform or shift','text',true],['hours','Hours worked','number',true],['earnings','Earnings ($)','number',true],['miles','Miles driven','number',false],['expenses','Expenses ($)','number',false]]},route:{accent:'#5b972c',title:'Find a route that fits.',desc:'Compare trips by time, distance, and estimated fuel cost.',fields:[['name','Route name','text',true],['miles','Distance (miles)','number',true],['minutes','Travel time (minutes)','number',true],['mpg','Vehicle fuel efficiency (mpg)','number',true],['fuel','Fuel price ($ per gallon)','number',true]]},cover:{accent:'#2268dc',title:'Compare the details that matter.',desc:'Enter quotes you have received and compare price, coverage and deductibles.',fields:[['name','Insurance company','text',true],['premium','Premium ($)','number',true],['months','Policy term (months)','number',true],['liability','Liability limits','text',false],['collision','Collision deductible ($)','number',false],['comprehensive','Comprehensive deductible ($)','number',false]]},stack:{accent:'#d7732d',title:'Turn progress into practice.',desc:'Connect skills and projects and keep your next step in sight.',fields:[['skill','Skill','text',true],['project','Related project','text',true],['goal','Weekly goal or next step','text',true],['status','Status','select:Planning|In progress|Completed',true]]},field:{accent:'#327659',title:'Collect what you notice.',desc:'Save places, observations, accessibility notes and a photo for later.',fields:[['place','Place','text',true],['category','Category','text',true],['notes','Observation','textarea',true],['access','Accessibility notes','text',false],['photo','Photo (optional; under 500 KB)','file',false]]},signal:{accent:'#1b806f',title:'Know what needs attention.',desc:'Track applications, stages and the next follow-up in one view.',fields:[['company','Company','text',true],['role','Role','text',true],['stage','Stage','select:Saved|Applied|Screening|Interview|Offer|Closed',true],['next','Next step','text',false],['followup','Follow-up date','date',false]]}};const id=location.hash.slice(1).toLowerCase(),key=configs[id]?id:'shift',cfg=configs[key],storage='heather-tool-'+key+'-v1';let entries;try{entries=JSON.parse(localStorage.getItem(storage)||'[]');if(!Array.isArray(entries))entries=[]}catch{entries=[]}document.documentElement.style.setProperty('--accent',cfg.accent);document.title=key.toUpperCase()+' — Heather Davies';document.querySelector('#brand').textContent=key.toUpperCase();const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x)||0,money=x=>'$'+Number(x).toFixed(2);const getcost=x=>num(x.miles)/num(x.mpg)*num(x.fuel);function formField([name,label,type,required]){let attrs=`name="${name}" ${required?'required':''}`;let input=type.startsWith('select:')?`<select ${attrs}>${type.slice(7).split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:type==='textarea'?`<textarea ${attrs} rows="3"></textarea>`:`<input ${attrs} type="${type}" ${type==='number'?'min="0" step="any"':''} ${name==='mpg'||name==='months'?'min="0.01"':''} ${type==='file'?'accept="image/*"':''}>`;return `<label class="field">${label}${input}</label>`}function sums(){if(key==='shift'){let e=entries.reduce((a,x)=>a+num(x.earnings),0),h=entries.reduce((a,x)=>a+num(x.hours),0),m=entries.reduce((a,x)=>a+num(x.miles),0);return [['Gross earnings',money(e)],['Gross / hour',h?money(e/h):'—'],['Miles logged',m.toFixed(1)]]}if(key==='route')return [['Saved routes',entries.length],['Shortest distance',entries.length?Math.min(...entries.map(x=>num(x.miles)))+' mi':'—'],['Lowest estimated fuel',entries.length?money(Math.min(...entries.map(getcost))):'—']];if(key==='cover')return [['Quotes',entries.length],['Lowest monthly equivalent',entries.length?money(Math.min(...entries.map(x=>num(x.premium)/num(x.months)))):'—'],['Missing coverage',entries.filter(x=>!x.liability||x.collision===''||x.comprehensive==='').length]];if(key==='stack')return [['Skills logged',new Set(entries.map(x=>x.skill.toLowerCase())).size],['Projects',new Set(entries.map(x=>x.project.toLowerCase())).size],['In progress',entries.filter(x=>x.status==='In progress').length]];if(key==='field')return [['Places saved',entries.length],['Categories',new Set(entries.map(x=>x.category.toLowerCase())).size],['With accessibility notes',entries.filter(x=>x.access).length]];return [['Applications',entries.length],['In progress',entries.filter(x=>['Applied','Screening','Interview'].includes(x.stage)).length],['With follow-up date',entries.filter(x=>x.followup).length]]}function description(x){if(key==='shift')return [x.date,`${x.hours} hours · ${money(x.earnings)} gross · ${x.miles||0} miles`,`Expenses: ${money(num(x.expenses))} · After entered expenses: ${money(num(x.earnings)-num(x.expenses))}`];if(key==='route')return [`${x.miles} miles · ${x.minutes} minutes`,`${x.mpg} mpg · ${money(x.fuel)}/gal · Estimated fuel ${money(getcost(x))}`];if(key==='cover')return [`${money(num(x.premium)/num(x.months))}/month equivalent · ${money(x.premium)} per ${x.months} months`,`Liability: ${x.liability||'Not entered'} · Collision: ${x.collision===''?'Not entered':money(x.collision)} · Comprehensive: ${x.comprehensive===''?'Not entered':money(x.comprehensive)}`];if(key==='stack')return [`${x.status} · ${x.project}`,`Next: ${x.goal}`];if(key==='field')return [x.category,x.notes,x.access?`Accessibility: ${x.access}`:''];return [`${x.role} · ${x.stage}`,x.next?`Next: ${x.next}`:'',x.followup?`Follow-up: ${x.followup}`:'']}function title(x){return x.platform||x.name||x.skill||x.place||x.company}function render(){document.querySelector('#content').innerHTML=`<div class="eyebrow">${key.toUpperCase()} / PRODUCT TOOL</div><h1>${cfg.title}</h1><p class="lead">${cfg.desc}</p><div class="layout"><section class="panel"><h2 class="form-title">Add ${key==='shift'?'a shift':key==='route'?'a route':key==='cover'?'a quote':key==='stack'?'a skill':key==='field'?'a place':'an application'}</h2><form id="form">${cfg.fields.map(formField).join('')}<button class="btn" type="submit">Save entry</button></form></section><section class="panel"><h2>Your overview</h2><p class="hint">${key==='cover'?'Compare equivalent coverage and verify policy terms with the insurer.':key==='shift'?'Entered expenses do not include taxes or unentered costs.':key==='route'?'Fuel costs are estimates based on the values you enter.':'Your saved entries appear here.'}</p><div class="cards">${sums().map(([a,b])=>`<div class="stat"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('')}</div><h2>Saved entries</h2>${key==='field'?'<div class="filters"><label for="filter">Filter</label><input id="filter" placeholder="Search category or place"></div>':''}<div class="entries" id="entries">${entries.length?entries.map((x,i)=>`<article class="entry" data-search="${esc((x.place||'')+' '+(x.category||''))}"><div><h3>${esc(title(x))}</h3>${description(x).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}${x.photo?`<img src="${esc(x.photo)}" alt="Photo saved for ${esc(x.place)}">`:''}</div><button class="remove" data-delete="${i}" aria-label="Remove ${esc(title(x))}">Remove</button></article>`).join(''):'<div class="empty">No entries yet. Add your first one to get started.</div>'}</div></section></div>`;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(key==='field'){let file=f.elements.photo.files[0];if(file&&file.size>500000){alert('Please choose a photo under 500 KB.');return}d.photo=file?await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)}):''}if(key==='shift'&&num(d.hours)<=0){alert('Enter hours greater than zero.');return}try{entries.unshift(d);localStorage.setItem(storage,JSON.stringify(entries));render()}catch{entries.shift();alert('Unable to save. Try a smaller photo or free browser storage.')}};document.querySelector('#entries').onclick=e=>{let i=e.target.dataset.delete;if(i!==undefined){entries.splice(Number(i),1);localStorage.setItem(storage,JSON.stringify(entries));render()}};let filter=document.querySelector('#filter');if(filter)filter.oninput=()=>document.querySelectorAll('[data-search]').forEach(el=>el.hidden=!el.dataset.search.toLowerCase().includes(filter.value.toLowerCase()))}document.querySelector('#navtools').innerHTML=Object.keys(configs).map(n=>`<a href="apps.html#${n}" class="${n===key?'active':''}">${n.toUpperCase()}</a>`).join('');window.addEventListener('hashchange',()=>location.reload());render();
</script></body></html>
